services:
  postgres:
    image: postgres:16-alpine
    container_name: crashpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crashpad
      POSTGRES_PASSWORD: crashpad_dev
      POSTGRES_DB: crashpad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashpad -d crashpad"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crashpad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
